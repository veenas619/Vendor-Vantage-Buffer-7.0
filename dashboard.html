<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard | Vendor Vantage</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .sidebar-wallet { background:rgba(255,159,67,0.1); border:1px solid rgba(255,159,67,0.3); border-radius:10px; padding:12px 16px; margin:16px 0; display:flex; justify-content:space-between; align-items:center; }
        .wallet-amount { color:#ff9f43; font-weight:700; font-size:1.1rem; }
        .topup-btn { background:#ff9f43; color:black; border:none; padding:6px 12px; border-radius:6px; font-size:0.8rem; font-weight:700; cursor:pointer; }
        .modal-overlay { position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px; }
        .modal-box { background:#1a1a1a;padding:30px;border-radius:20px;width:100%;max-width:460px;color:white;border:1px solid #333;max-height:90vh;overflow-y:auto; }
        .modal-input { width:100%;padding:12px;background:#222;border:1px solid #444;color:white;border-radius:8px;margin-bottom:10px;font-family:Poppins,sans-serif; }
        .menu-item-row { display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#222;border-radius:8px;margin-bottom:8px; }
        .qty-control { display:flex;align-items:center;gap:8px; }
        .qty-btn { background:#333;color:white;border:none;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:1rem;font-weight:bold; }
        .qty-display { color:white;min-width:20px;text-align:center;font-weight:600; }
        .cart-summary { background:#111;padding:12px;border-radius:8px;margin-top:12px;border:1px solid #333; }
        .cart-row { display:flex;justify-content:space-between;color:#bdc3c7;font-size:0.9rem;margin-bottom:4px; }
        .cart-total { display:flex;justify-content:space-between;color:white;font-weight:bold;padding-top:8px;border-top:1px solid #333;margin-top:8px; }
        .token-info { color:#ff9f43;font-size:0.85rem;margin-top:6px; }
        .alert-modal { position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:10000;display:flex;align-items:center;justify-content:center; }
        .alert-box { background:#1a1a1a;padding:30px;border-radius:16px;max-width:380px;width:90%;color:white;border:1px solid #444;text-align:center; }
        .alert-icon { font-size:2.5rem;margin-bottom:12px; }
        .alert-msg { color:#bdc3c7;margin:8px 0 20px;line-height:1.6;white-space:pre-line; }
        .alert-btn { background:#ff9f43;color:black;border:none;padding:12px 30px;border-radius:8px;font-weight:bold;cursor:pointer; }
        .my-orders-card { background:#1a1a1a;padding:16px;border-radius:12px;border:1px solid #333;margin-bottom:12px; }
        .order-status-pill { display:inline-block;padding:4px 12px;border-radius:20px;font-size:0.8rem;font-weight:600; }
        .pill-PENDING   { background:rgba(255,159,67,0.15);color:#ff9f43;border:1px solid #ff9f43; }
        .pill-ACCEPTED  { background:rgba(52,152,219,0.15);color:#3498db;border:1px solid #3498db; }
        .pill-READY     { background:rgba(46,204,113,0.15);color:#2ecc71;border:1px solid #2ecc71; }
        .pill-COLLECTED { background:rgba(150,150,150,0.15);color:#888;border:1px solid #888; }
        .pill-DECLINED  { background:rgba(231,76,60,0.15);color:#e74c3c;border:1px solid #e74c3c; }
        .star { font-size:1.8rem;color:#444;cursor:pointer;transition:color 0.15s; }
        .star.active { color:#ff9f43; }
        .review-form-card { background:#1a1a1a;padding:24px;border-radius:16px;border:1px solid #333;max-width:500px; }
        .review-form-card select, .review-form-card textarea { width:100%;background:#222;border:1px solid #444;color:white;padding:10px;border-radius:8px;font-family:Poppins,sans-serif;margin-top:6px; }
        .review-form-card label { color:#95a5a6;font-size:0.85rem; }
        .collect-btn { background:#2ecc71;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;margin-top:8px; }
        .notif-dot { width:8px;height:8px;background:#e74c3c;border-radius:50%;display:inline-block;margin-left:4px; }
    </style>
</head>
<body class="dashboard-body">
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="profile-section">
                <div class="avatar">🍔</div>
                <h3 id="displayUserName">Foodie</h3>
                <p id="displayUserRole">Customer</p>
            </div>
            <div class="sidebar-wallet">
                <span style="color:#bdc3c7;font-size:0.9rem">💰 Wallet</span>
                <div>
                    <span class="wallet-amount">₹<span id="sidebarWallet">---</span></span>
                    <button class="topup-btn" onclick="topupWallet()">+Add</button>
                </div>
            </div>
            <nav class="side-nav">
                <a href="#" class="active" onclick="showDashTab('vendors',this)">📍 Live Stalls</a>
                <a href="#" onclick="showDashTab('myorders',this)">🛒 My Orders</a>
                <a href="#" onclick="showDashTab('reviews',this)">⭐ Leave Review</a>
                <a href="#" class="logout" onclick="logoutCustomer()">🚪 Logout</a>
            </nav>
        </aside>

        <main class="main-content foodie-vibe">
            <!-- VENDORS TAB -->
            <div id="tab-vendors">
                <header class="dashboard-header">
                    <div class="search-container">
                        <input type="text" id="foodSearch" placeholder="Search Momos, Coffee, Vada Pav...">
                        <button id="searchBtn">🔍</button>
                    </div>
                </header>
                <h2 id="welcomeGreeting" style="margin-bottom:20px;color:white">Welcome back!</h2>
                <div class="vendor-grid" id="vendorGrid"></div>
            </div>

            <!-- MY ORDERS TAB -->
            <div id="tab-myorders" style="display:none">
                <h2 style="color:white;margin-bottom:20px">🛒 My Orders</h2>
                <div id="myOrdersList"></div>
            </div>

            <!-- REVIEWS TAB -->
            <div id="tab-reviews" style="display:none">
                <h2 style="color:white;margin-bottom:20px">⭐ Leave a Review</h2>
                <div class="review-form-card">
                    <div style="margin-bottom:14px">
                        <label>Select Vendor</label>
                        <select id="reviewVendorKey"></select>
                    </div>
                    <div style="margin-bottom:14px">
                        <label>Rating</label>
                        <div id="starRow" style="margin-top:8px">
                            <span class="star active" data-v="1">★</span>
                            <span class="star active" data-v="2">★</span>
                            <span class="star active" data-v="3">★</span>
                            <span class="star active" data-v="4">★</span>
                            <span class="star active" data-v="5">★</span>
                        </div>
                        <input type="hidden" id="reviewRating" value="5">
                    </div>
                    <div style="margin-bottom:14px">
                        <label>Comment</label>
                        <textarea id="reviewComment" rows="3" placeholder="How was the food?"></textarea>
                    </div>
                    <button class="auth-btn" onclick="submitReview()">Submit Review</button>
                    <div id="reviewMsg" style="margin-top:10px;color:#2ecc71;display:none"></div>
                </div>

                <div class="review-form-card" style="margin-top:24px">
                    <h3 style="color:white;margin-bottom:16px">📖 Read Reviews</h3>
                    <div style="margin-bottom:14px">
                        <label>Select Vendor</label>
                        <select id="readReviewVendorKey" onchange="loadVendorReviews()"></select>
                    </div>
                    <div id="reviewsList" style="margin-top:12px"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Order Modal -->
    <div id="orderModal" class="modal-overlay" style="display:none">
        <div class="modal-box">
            <h3 id="modalVendorName" style="margin-bottom:16px">Order</h3>
            <div id="menuItemsList"></div>
            <div class="cart-summary" id="cartSummary" style="display:none">
                <div id="cartItems"></div>
                <div class="cart-total"><span>Total</span><span id="cartTotal">₹0</span></div>
                <div class="token-info">🔒 Token deposit: ₹<span id="tokenDeposit">0</span> (1/4 of bill)</div>
            </div>
            <input class="modal-input" id="orderLocation" placeholder="Your pickup location / stop name" style="margin-top:12px">
            <div style="display:flex;gap:10px;margin-top:14px">
                <button class="auth-btn" onclick="submitOrder()">Place Order</button>
                <button class="auth-btn" style="background:#555" onclick="closeOrderModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="alertModal" class="alert-modal" style="display:none">
        <div class="alert-box">
            <div class="alert-icon" id="alertIcon">ℹ️</div>
            <h3 id="alertTitle"></h3>
            <p class="alert-msg" id="alertMsg"></p>
            <button class="alert-btn" onclick="closeAlert()">Got it</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
