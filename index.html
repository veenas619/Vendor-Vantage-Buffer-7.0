<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Vantage | Gateway</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="gateway-container">
        <h1 class="brand">🍕 Vendor Vantage</h1>
        <p style="color:#bdc3c7;">Track your favorite stalls in real-time!</p>
        <div class="card-wrapper">
            <div class="choice-card" id="customerCard">
                <span class="icon">🍔</span>
                <h3>I'm a Foodie</h3>
                <p>Hungry? Find active vendors near you.</p>
            </div>
            <div class="choice-card" id="vendorCard">
                <span class="icon">🚚</span>
                <h3>I'm a Vendor</h3>
                <p>Go live and share your route with foodies.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
